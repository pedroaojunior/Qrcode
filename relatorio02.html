<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório Confraternização SAELCE</title>
    <!-- Cliente Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; color: #333; text-align: center; }
        .dashboard { display: flex; gap: 20px; justify-content: center; margin: 40px 0; flex-wrap: wrap; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 220px; }
        .number { font-size: 48px; font-weight: bold; margin: 10px 0; }
        .card.almoco .number { color: #2ecc71; }
        .card.cerveja .number { color: #e74c3c; }
        .btn { background: #3498db; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 6px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #2980b9; }
        .status-atualizacao { font-size: 13px; color: #7f8c8d; margin-top: 15px; }

        /* Estilos da Tabela de Registros */
        .table-container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: left;
            overflow-x: auto;
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .table-header h2 {
            margin: 0;
            font-size: 20px;
            color: #2c3e50;
        }
        .tabela-registros {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .tabela-registros th, .tabela-registros td {
            padding: 12px 14px;
            border-bottom: 1px solid #eef2f5;
            text-align: left;
        }
        .tabela-registros th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
        }
        .tabela-registros tr:hover {
            background-color: #f9fbfd;
        }
        .btn-excluir {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-excluir:hover {
            background-color: #c0392b;
        }
        .btn-excluir:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .vazio {
            text-align: center;
            color: #7f8c8d;
            padding: 25px;
        }
        .badge-id {
            background: #eef2f7;
            color: #334155;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }

        @media print { 
            .btn, .status-atualizacao, .btn-excluir, .col-acao { display: none; }
            .table-container { box-shadow: none; padding: 0; margin: 20px auto; width: 100%; }
        }
    </style>
</head>
<body>
    <h1>📊 Painel de Consumo em Tempo Real</h1>
    <p>Confraternização de Fim de Ano - SAELCE</p>

    <div class="dashboard">
        <div class="card almoco">
            <h3>Almoços Liberados</h3>
            <div class="number" id="total-almoco">...</div>
        </div>
        <div class="card cerveja">
            <h3>Cervejas Consumidas</h3>
            <div class="number" id="total-cerveja">...</div>
        </div>
    </div>

    <button class="btn" onclick="atualizarTotais()">🔄 Atualizar Agora</button>
    <button class="btn" onclick="window.print()">🖨️ Encerrar e Imprimir</button>

    <div class="status-atualizacao" id="ultimo-status">Carregando dados...</div>

    <!-- TABELA DE REGISTROS DO BANCO (Tabela 'almoco') -->
    <div class="table-container">
        <div class="table-header">
            <h2>📋 Registros de Almoço (Banco de Dados)</h2>
            <span id="contador-registros" style="color: #7f8c8d; font-size: 14px;">Carregando...</span>
        </div>

        <table class="tabela-registros">
            <thead>
                <tr>
                    <th style="width: 80px;">ID</th>
                    <th>Código de Barras / Crachá</th>
                    <th>Data / Hora do Registro</th>
                    <th class="col-acao" style="text-align: center; width: 120px;">Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo">
                <tr>
                    <td colspan="4" class="vazio">Carregando registros...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // ========================================================
        // 1. CONFIGURAÇÃO DO SUPABASE
        // Substitua pelas suas chaves (as mesmas do index.html)
        // ========================================================
        const SUPABASE_URL = "https://xgbhzhkvfagpmyhmzwuk.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhnYmh6aGt2ZmFncG15aG16d3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MjkyMTcsImV4cCI6MjA5NjEwNTIxN30.ROMcYDStFJVUlZzFVTEizu8xXTeQjPF0IZDJeRe4s_8";


        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ========================================================
        // 2. FUNÇÃO DE CONTAGEM OTIMIZADA
        // ========================================================
        async function atualizarTotais() {
            const statusElem = document.getElementById("ultimo-status");
            statusElem.innerText = "Atualizando contagem...";

            try {
                // Contagem ultra-leve da tabela 'almoco' (HEAD query)
                const { count: almocoCount, error: errAlmoco } = await _supabase
                    .from('almoco')
                    .select('*', { count: 'exact', head: true });

                if (errAlmoco) throw errAlmoco;

                // Contagem ultra-leve da tabela 'cerveja' (HEAD query)
                const { count: cervejaCount, error: errCerveja } = await _supabase
                    .from('cerveja')
                    .select('*', { count: 'exact', head: true });

                if (errCerveja) throw errCerveja;

                // Atualiza na tela os valores retornados
                document.getElementById("total-almoco").innerText = almocoCount ?? 0;
                document.getElementById("total-cerveja").innerText = cervejaCount ?? 0;

                const horaAtual = new Date().toLocaleTimeString('pt-BR');
                statusElem.innerText = `Atualizado automaticamente às ${horaAtual} (Próxima em 1 min)`;

                // Atualiza também a tabela de registros
                await carregarRegistros();

            } catch (error) {
                console.error("Erro ao buscar contagens:", error);
                statusElem.innerText = "❌ Erro ao atualizar os totais. Verifique a conexão.";
            }
        }

        // ========================================================
        // 3. FUNÇÕES DA TABELA DE REGISTROS (TABELA 'almoco')
        // ========================================================
        function formatarData(dataIso) {
            if (!dataIso) return '-';
            try {
                const data = new Date(dataIso);
                if (isNaN(data.getTime())) return dataIso;
                return data.toLocaleString('pt-BR');
            } catch (e) {
                return dataIso;
            }
        }

        async function carregarRegistros() {
            const tbody = document.getElementById("tabela-corpo");
            const contador = document.getElementById("contador-registros");

            try {
                const { data: registros, error } = await _supabase
                    .from('almoco')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                if (!registros || registros.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="vazio">Nenhum registro encontrado no banco de dados.</td></tr>';
                    contador.innerText = "0 registros";
                    return;
                }

                contador.innerText = `${registros.length} registro(s) no total`;

                tbody.innerHTML = registros.map(reg => `
                    <tr id="linha-${reg.id}">
                        <td><span class="badge-id">#${reg.id}</span></td>
                        <td><strong>${reg.codigo_barras || '-'}</strong></td>
                        <td>${formatarData(reg.criado_em)}</td>
                        <td class="col-acao" style="text-align: center;">
                            <button class="btn-excluir" onclick="excluirRegistro(${reg.id})">🗑️ Excluir</button>
                        </td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error("Erro ao carregar registros:", error);
                tbody.innerHTML = '<tr><td colspan="4" class="vazio" style="color: #e74c3c;">❌ Erro ao carregar registros do banco.</td></tr>';
                contador.innerText = "Erro ao carregar";
            }
        }

        async function excluirRegistro(id) {
            if (!confirm(`Deseja realmente excluir o registro ID #${id}?`)) {
                return;
            }

            const btn = event?.target;
            if (btn) {
                btn.disabled = true;
                btn.innerText = "Excluindo...";
            }

            try {
                const { data, error } = await _supabase
                    .from('almoco')
                    .delete()
                    .eq('id', id)
                    .select();

                if (error) {
                    alert("Erro ao excluir registro: " + (error.message || JSON.stringify(error)));
                    if (btn) {
                        btn.disabled = false;
                        btn.innerText = "🗑️ Excluir";
                    }
                    return;
                }

                // Supabase com RLS ativo que bloqueia anon DELETE retorna array vazio sem erro
                if (data && data.length === 0) {
                    alert("⚠️ Atenção: O registro não pôde ser excluído no banco de dados.\n\nMotivo comum: O Supabase bloqueou a exclusão devido a políticas de segurança (RLS). Para permitir, acesse o painel do Supabase e adicione uma política permitindo DELETE para 'anon' na tabela 'almoco'.");
                    if (btn) {
                        btn.disabled = false;
                        btn.innerText = "🗑️ Excluir";
                    }
                    return;
                }

                // Atualiza contadores e tabela
                await atualizarTotais();

            } catch (err) {
                console.error("Erro ao excluir:", err);
                alert("Erro ao excluir o registro. Verifique a conexão com o banco.");
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = "🗑️ Excluir";
                }
            }
        }

        // Carrega imediatamente ao abrir a página
        atualizarTotais();

        // Atualiza AUTOMATICAMENTE a cada 1 minuto (60.000 ms)
        setInterval(atualizarTotais, 60000);
    </script>
</body>
</html>
